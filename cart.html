<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your Cart | FullCourt Supply</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/products.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body data-page="cart">
    <header class="site-header">
      <nav class="nav container">
        <a class="logo" href="index.html">Full<span>Court</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a><a href="products.html">Products</a
          ><a href="about.html">About</a>
        </div>
        <div class="nav-actions">
          <a class="icon-btn" href="cart.html"
            >🛒<span class="count" data-cart-count>0</span></a
          ><button class="icon-btn menu-btn">☰</button>
        </div>
      </nav>
    </header>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">Almost game time</span>
          <h1>Your cart</h1>
        </div>
      </section>
      <section class="section">
        <div class="container cart-layout">
          <div class="cart-list" id="cart-list"></div>
          <aside class="summary">
            <h2>Order summary</h2>
            <div class="summary-line">
              <span>Subtotal</span><strong id="subtotal">₱0</strong>
            </div>
            <div class="summary-line">
              <span>Shipping</span><strong id="shipping">FREE</strong>
            </div>
            <div class="promo">
              <input id="promo" placeholder="Promo code" /><button
                id="apply-promo"
                class="btn btn-dark"
              >
                Apply
              </button>
            </div>
            <div class="summary-line summary-total">
              <span>Total</span><span id="total">₱0</span>
            </div>
            <a class="btn btn-primary btn-block" href="checkout.html"
              >Proceed to checkout</a
            ><a
              class="text-btn"
              href="products.html"
              style="display: block; text-align: center; margin-top: 12px"
              >← Continue shopping</a
            >
          </aside>
        </div>
      </section>
    </main>
    <div class="toast"></div>
  </body>
</html>
