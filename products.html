<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Products | FullCourt Supply</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/products.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body data-page="products">
    <div class="top-strip">Free delivery on orders over ₱2,500</div>
    <header class="site-header">
      <nav class="nav container">
        <a class="logo" href="index.html">Full<span>Court</span></a>
        <div class="nav-links">
          <a data-nav="home" href="index.html">Home</a
          ><a data-nav="products" href="products.html">Products</a
          ><a href="#categories">Categories</a
          ><a data-nav="about" href="about.html">About</a
          ><a href="tracking.html">Track Order</a>
        </div>
        <div class="nav-actions">
          <a class="icon-btn" href="notifications.html">🔔</a
          ><a class="icon-btn" href="cart.html"
            >🛒<span class="count" data-cart-count>0</span></a
          ><button class="icon-btn menu-btn">☰</button>
        </div>
      </nav>
    </header>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">The equipment room</span>
          <h1>Shop all gear</h1>
          <p>
            Search and filter the collection to find exactly what your game
            needs.
          </p>
        </div>
      </section>
      <section class="section">
        <div class="container catalogue-layout" id="catalogue-controls">
          <aside class="filters" id="categories">
            <h3>Filters</h3>
            <div class="filter-group">
              <strong>Category</strong>
              <div class="filter-options" id="category-options"></div>
            </div>
            <div class="filter-group">
              <label for="price-filter"><strong>Maximum price</strong></label
              ><select id="price-filter" class="select">
                <option value="0">Any price</option>
                <option value="500">Under ₱500</option>
                <option value="1000">Under ₱1,000</option>
                <option value="2500">Under ₱2,500</option>
                <option value="5000">Under ₱5,000</option>
              </select>
            </div>
            <button id="clear-filters" class="text-btn">
              Clear all filters
            </button>
          </aside>
          <div>
            <div class="catalogue-tools">
              <div class="search-box">
                <input
                  id="catalogue-search"
                  type="search"
                  placeholder="Search basketballs, shoes, training gear…"
                  aria-label="Search products"
                />
              </div>
              <select
                id="sort-products"
                class="select"
                aria-label="Sort products"
              >
                <option value="featured">Featured</option>
                <option value="low">Price: low to high</option>
                <option value="high">Price: high to low</option>
                <option value="rating">Highest rated</option>
              </select>
            </div>
            <p class="result-count" id="result-count"></p>
            <div class="product-grid" id="product-grid"></div>
          </div>
        </div>
      </section>
    </main>
    <div id="quick-modal" class="modal"></div>
    <div class="toast"></div>
  </body>
</html>
