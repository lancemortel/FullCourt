<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Settings | FullCourt Supply</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/products.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container">
        <a class="logo" href="index.html">Full<span>Court</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a><a href="products.html">Products</a
          ><a class="active" href="settings.html">Settings</a>
        </div>
        <div class="nav-actions">
          <a class="icon-btn" href="cart.html"
            >🛒<span class="count" data-cart-count>0</span></a
          ><button class="icon-btn menu-btn">☰</button>
        </div>
      </nav>
    </header>
    <main>
      <section class="page-hero">
        <div class="container">
          <span class="eyebrow">Player account</span>
          <h1>Settings</h1>
        </div>
      </section>
      <section class="section">
        <div class="container" style="max-width: 800px">
          <form class="panel" data-validate data-success="Demo settings saved.">
            <h2>Profile</h2>
            <div class="form-grid">
              <div class="field">
                <label>Display name</label
                ><input required value="Demo Player" /><small class="error"
                  >Required</small
                >
              </div>
              <div class="field">
                <label>Email</label
                ><input
                  type="email"
                  required
                  value="player@example.com"
                /><small class="error">Valid email required</small>
              </div>
              <div class="field full">
                <label>Preferred position</label
                ><select>
                  <option>Point Guard</option>
                  <option>Shooting Guard</option>
                  <option>Small Forward</option>
                  <option>Power Forward</option>
                  <option>Center</option>
                  <option>Coach</option>
                </select>
              </div>
            </div>
            <h2>Notifications</h2>
            <p>
              <label
                ><input type="checkbox" checked /> Order status updates</label
              >
            </p>
            <p>
              <label
                ><input type="checkbox" checked /> Back-in-stock alerts</label
              >
            </p>
            <p>
              <label
                ><input type="checkbox" /> Weekly product recommendations</label
              >
            </p>
            <button class="btn btn-primary">Save settings</button>
          </form>
        </div>
      </section>
    </main>
    <div class="toast"></div>
  </body>
</html>
